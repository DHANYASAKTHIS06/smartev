<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login - Smart EV Network</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: #0a0f1d; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div style="width: 100%; max-width: 440px; background: #111827; border-radius: 12px; border: 1px solid #1f2937; padding: 2.5rem; color: #ffffff; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 54px; height: 54px; background: #00d176; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; color: #0a0f1d; margin: 0 auto 1rem auto; box-shadow: 0 0 20px rgba(0,209,118,0.4);">
                <i class="fa-solid fa-gears"></i>
            </div>
            <h1 style="font-size: 1.6rem; color: #ffffff; margin-bottom: 0.25rem;">Admin Portal Access</h1>
            <p style="color: #9ca3af; font-size: 0.85rem;">Neo4j Graph Network & Demand Management</p>
        </div>

        <form onsubmit="handleAdminLogin(event)">
            <div class="form-group mb-3">
                <label class="form-label" style="color: #e5e7eb;">Admin Username / Email</label>
                <input type="text" id="adminUser" class="form-control" value="admin@smartev.io" style="background: #0a0f1d; border-color: #374151; color: #ffffff;" required>
            </div>

            <div class="form-group mb-3">
                <label class="form-label" style="color: #e5e7eb;">Security Password</label>
                <input type="password" id="adminPass" class="form-control" value="admin123" style="background: #0a0f1d; border-color: #374151; color: #ffffff;" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
                <i class="fa-solid fa-lock mr-2"></i> Authenticate & Access Console
            </button>

            <div style="text-align: center; margin-top: 1.5rem;">
                <a href="login.html" style="color: #9ca3af; font-size: 0.85rem; text-decoration: none;">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Return to Driver Login
                </a>
            </div>
        </form>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        function handleAdminLogin(e) {
            e.preventDefault();
            localStorage.setItem('smartev_admin', 'true');
            showToast('Admin authenticated successfully!', 'success');
            setTimeout(() => {
                window.location.href = 'admin_dashboard.html';
            }, 600);
        }
    </script>
</body>
</html>
